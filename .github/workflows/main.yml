name: Deploy to Hostinger
on:
  push:
    branches:
      - main
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      BACKEND_ENV: ${{ secrets.BACKEND_ENV }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install frontend deps
        run: cd frontend && npm install

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Install admin deps
        run: cd admin && npm install

      - name: Build admin
        run: cd admin && npm run build

      - name: Check build output
        run: |
          echo "=== Frontend ==="
          ls -la backend/public/frontend/ || echo "MISSING"
          echo "=== Admin ==="
          ls -la backend/public/admin/ || echo "MISSING"

      - name: Prepare backend for upload (strip vendor, node_modules, large storage)
        run: |
          rsync -a \
            --exclude=vendor \
            --exclude=node_modules \
            --exclude=storage/app/public \
            --exclude=storage/logs \
            --exclude=storage/framework/cache \
            --exclude=storage/framework/sessions \
            --exclude=.git \
            backend/ backend_deploy/
          echo "=== Deploy size ==="
          du -sh backend_deploy/

      - name: Setup SSH for rsync
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p 65002 $SSH_HOST >> ~/.ssh/known_hosts || true
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}

      - name: Rsync backend to server
        run: |
          rsync -avz --delete -e "ssh -p 65002 -i ~/.ssh/id_rsa" backend_deploy/ ${SSH_USERNAME}@${SSH_HOST}:/home/u679970628/domains/speakeasyvalencia.com/backend/
        env:
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_HOST: ${{ secrets.SSH_HOST }}

      - name: Rsync storage assets to server
        run: |
          rsync -avz --delete -e "ssh -p 65002 -i ~/.ssh/id_rsa" backend/storage/app/public/ ${SSH_USERNAME}@${SSH_HOST}:/home/u679970628/domains/speakeasyvalencia.com/backend/storage/app/public/
        env:
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_HOST: ${{ secrets.SSH_HOST }}

      - name: Rsync frontend to server
        run: |
          rsync -avz --delete -e "ssh -p 65002 -i ~/.ssh/id_rsa" backend/public/frontend/ ${SSH_USERNAME}@${SSH_HOST}:/home/u679970628/domains/speakeasyvalencia.com/public_html/
        env:
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_HOST: ${{ secrets.SSH_HOST }}

      - name: Rsync admin to server
        run: |
          rsync -avz --delete -e "ssh -p 65002 -i ~/.ssh/id_rsa" backend/public/admin/ ${SSH_USERNAME}@${SSH_HOST}:/home/u679970628/domains/speakeasyvalencia.com/public_html/admin/
        env:
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_HOST: ${{ secrets.SSH_HOST }}

      - name: Rsync public_html config to server
        run: |
          rsync -avz --delete -e "ssh -p 65002 -i ~/.ssh/id_rsa" deploy/public_html/ ${SSH_USERNAME}@${SSH_HOST}:/home/u679970628/domains/speakeasyvalencia.com/public_html/
        env:
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_HOST: ${{ secrets.SSH_HOST }}

      - name: Write .env on server
        if: ${{ env.BACKEND_ENV != '' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 65002
          envs: BACKEND_ENV
          script: |
            printf '%s' "$BACKEND_ENV" > /home/u679970628/domains/speakeasyvalencia.com/backend/.env
            echo ".env written"
        env:
          BACKEND_ENV: ${{ secrets.BACKEND_ENV }}

      - name: Post-deploy (composer + artisan + symlink)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 65002
          timeout: 300s
          command_timeout: 30m
          script: |
            BASE=/home/u679970628/domains/speakeasyvalencia.com
            mkdir -p $BASE/backend $BASE/public_html/admin
            mkdir -p $BASE/backend/storage/framework/sessions
            mkdir -p $BASE/backend/storage/framework/cache/data
            mkdir -p $BASE/backend/storage/framework/views
            mkdir -p $BASE/backend/storage/logs
            cd $BASE/backend
            php composer.phar install --no-dev --optimize-autoloader 2>/dev/null || composer install --no-dev --optimize-autoloader
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan migrate --force
            php artisan db:seed --class=AdminSeeder --force
            php artisan cache:clear
            chmod -R 775 storage bootstrap/cache
            STORAGE_LINK=$BASE/public_html/storage
            if [ -L "$STORAGE_LINK" ]; then rm "$STORAGE_LINK"; fi
            ln -s $BASE/backend/storage/app/public "$STORAGE_LINK"

            # Ensure correct ownership and permissions for web root (fix 403)
            SSH_USER="$(id -un || echo u679970628)"
            echo "Setting ownership to ${SSH_USER} on $BASE/public_html and $BASE/backend"
            chown -R ${SSH_USER}:${SSH_USER} $BASE/public_html || true
            chown -R ${SSH_USER}:${SSH_USER} $BASE/backend || true

            echo "Fixing permissions: directories 755, files 644"
            find $BASE/public_html -type d -exec chmod 755 {} + || true
            find $BASE/public_html -type f -exec chmod 644 {} + || true

            # Confirm index.php presence
            if [ -f $BASE/public_html/index.php ]; then
              echo "index.php present"
            else
              echo "WARNING: index.php missing from web root"
            fi

            echo "=== Done ==="
            ls -la $BASE/public_html/
