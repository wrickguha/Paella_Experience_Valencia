name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      BACKEND_ENV: ${{ secrets.BACKEND_ENV }}

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Node setup with caching ────────────────────────────────
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            admin/package-lock.json

      # ── 3. Install & build frontend ───────────────────────────────
      - name: Install frontend deps
        run: cd frontend && npm ci

      - name: Build frontend
        run: cd frontend && npm run build

      # ── 4. Install & build admin ──────────────────────────────────
      - name: Install admin deps
        run: cd admin && npm ci

      - name: Build admin
        run: cd admin && npm run build

      # ── 5. Verify build outputs ───────────────────────────────────
      - name: Check build output
        run: |
          echo "=== Frontend (should contain index.html) ==="
          ls -la backend/public/frontend/ || echo "MISSING - build failed!"
          echo "=== Admin (should contain index.html) ==="
          ls -la backend/public/admin/ || echo "MISSING - build failed!"

      # ── 6. Strip large/unnecessary files from backend ────────────
      - name: Prepare backend for upload
        run: |
          rsync -a \
            --exclude=vendor \
            --exclude=node_modules \
            --exclude=storage/app/public \
            --exclude=storage/logs \
            --exclude=storage/framework/cache \
            --exclude=storage/framework/sessions \
            --exclude=storage/framework/views \
            --exclude=.git \
            --exclude=.gitignore \
            --exclude=.gitattributes \
            --exclude=error_log.txt \
            --exclude=error_log_utf8.txt \
            --exclude=tests \
            --exclude=*.md \
            --exclude=phpunit.xml \
            --exclude=.editorconfig \
            backend/ backend_deploy/
          echo "=== Deploy size ==="
          du -sh backend_deploy/
          echo "=== Top-level items ==="
          ls -la backend_deploy/

      # ── 7. Setup SSH once (reused by all rsync steps) ────────────
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          # Write a persistent SSH config to avoid repeating options
          cat >> ~/.ssh/config <<EOF
          Host hostinger
            HostName $SSH_HOST
            Port 65002
            User $SSH_USERNAME
            IdentityFile ~/.ssh/id_rsa
            StrictHostKeyChecking no
            ConnectTimeout 60
            ServerAliveInterval 60
            ServerAliveCountMax 10
            BatchMode yes
            TCPKeepAlive yes
          EOF
          chmod 600 ~/.ssh/config

          # Pre-scan the host key
          ssh-keyscan -p 65002 "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "SSH configured for $SSH_HOST:65002"
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}

      # ── Helper: SSH options string ────────────────────────────────
      # Defined as an env var used by all rsync steps below
      # Using the SSH config alias "hostinger" for all connections

      # ── 8. Upload backend (no --delete: keeps vendor/storage safe) ─
      - name: Rsync backend to server
        run: |
          for i in 1 2 3; do
            rsync -az --checksum \
              -e "ssh -F ~/.ssh/config" \
              backend_deploy/ \
              hostinger:/home/u679970628/domains/speakeasyvalencia.com/backend/ \
            && echo "Backend rsync succeeded on attempt $i" && break \
            || {
              echo "Attempt $i failed. Waiting 15s before retry..."
              sleep 15
            }
          done
        env:
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_HOST: ${{ secrets.SSH_HOST }}

      # ── 9. Upload storage assets ──────────────────────────────────
      - name: Rsync storage assets to server
        run: |
          for i in 1 2 3; do
            rsync -az --checksum \
              -e "ssh -F ~/.ssh/config" \
              backend/storage/app/public/ \
              hostinger:/home/u679970628/domains/speakeasyvalencia.com/backend/storage/app/public/ \
            && echo "Storage rsync succeeded on attempt $i" && break \
            || {
              echo "Attempt $i failed. Waiting 15s before retry..."
              sleep 15
            }
          done
        env:
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_HOST: ${{ secrets.SSH_HOST }}

      # ── 10. Upload public_html config (htaccess + api entry) ──────
      - name: Rsync api entry point to server
        run: |
          for i in 1 2 3; do
            rsync -az --delete --checksum \
              -e "ssh -F ~/.ssh/config" \
              deploy/public_html/api/ \
              hostinger:/home/u679970628/domains/speakeasyvalencia.com/public_html/api/ \
            && echo "API rsync succeeded on attempt $i" && break \
            || {
              echo "Attempt $i failed. Waiting 15s before retry..."
              sleep 15
            }
          done
        env:
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_HOST: ${{ secrets.SSH_HOST }}

      - name: Rsync htaccess to server
        run: |
          for i in 1 2 3; do
            rsync -az --checksum \
              -e "ssh -F ~/.ssh/config" \
              deploy/public_html/.htaccess \
              hostinger:/home/u679970628/domains/speakeasyvalencia.com/public_html/.htaccess \
            && echo "htaccess rsync succeeded on attempt $i" && break \
            || {
              echo "Attempt $i failed. Waiting 15s before retry..."
              sleep 15
            }
          done
        env:
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_HOST: ${{ secrets.SSH_HOST }}

      # ── 11. Upload frontend SPA ───────────────────────────────────
      - name: Rsync frontend to server
        run: |
          for i in 1 2 3; do
            rsync -az --delete --checksum \
              --exclude=admin/ \
              --exclude=api/ \
              --exclude=storage/ \
              --exclude=.htaccess \
              -e "ssh -F ~/.ssh/config" \
              backend/public/frontend/ \
              hostinger:/home/u679970628/domains/speakeasyvalencia.com/public_html/ \
            && echo "Frontend rsync succeeded on attempt $i" && break \
            || {
              echo "Attempt $i failed. Waiting 15s before retry..."
              sleep 15
            }
          done
        env:
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_HOST: ${{ secrets.SSH_HOST }}

      # ── 12. Upload admin SPA ──────────────────────────────────────
      - name: Rsync admin to server
        run: |
          for i in 1 2 3; do
            rsync -az --delete --checksum \
              -e "ssh -F ~/.ssh/config" \
              backend/public/admin/ \
              hostinger:/home/u679970628/domains/speakeasyvalencia.com/public_html/admin/ \
            && echo "Admin rsync succeeded on attempt $i" && break \
            || {
              echo "Attempt $i failed. Waiting 15s before retry..."
              sleep 15
            }
          done
        env:
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_HOST: ${{ secrets.SSH_HOST }}

      # ── 13. Write .env on server ──────────────────────────────────
      - name: Write .env on server
        if: ${{ env.BACKEND_ENV != '' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 65002
          connect_timeout: 60s
          envs: BACKEND_ENV
          script: |
            printf '%s' "$BACKEND_ENV" > /home/u679970628/domains/speakeasyvalencia.com/backend/.env
            echo ".env written successfully"
        env:
          BACKEND_ENV: ${{ secrets.BACKEND_ENV }}

      # ── 14. Post-deploy: composer + artisan + permissions ─────────
      - name: Post-deploy (composer + artisan + symlink + permissions)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 65002
          connect_timeout: 60s
          timeout: 60s
          command_timeout: 30m
          script: |
            BASE=/home/u679970628/domains/speakeasyvalencia.com
            BACKEND=$BASE/backend
            WEBROOT=$BASE/public_html

            # Ensure required storage directories exist
            mkdir -p $BACKEND/storage/framework/sessions
            mkdir -p $BACKEND/storage/framework/cache/data
            mkdir -p $BACKEND/storage/framework/views
            mkdir -p $BACKEND/storage/logs
            mkdir -p $WEBROOT/admin

            # Run Composer install
            cd $BACKEND
            if [ -f composer.phar ]; then
              php composer.phar install --no-dev --optimize-autoloader --no-interaction
            else
              composer install --no-dev --optimize-autoloader --no-interaction
            fi

            # Laravel artisan commands
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan migrate --force
            php artisan db:seed --class=AdminSeeder --force
            php artisan cache:clear

            # Storage permissions
            chmod -R 775 $BACKEND/storage $BACKEND/bootstrap/cache

            # Storage symlink (public_html/storage -> backend/storage/app/public)
            STORAGE_LINK=$WEBROOT/storage
            if [ -L "$STORAGE_LINK" ]; then rm "$STORAGE_LINK"; fi
            if [ -e "$STORAGE_LINK" ]; then rm -rf "$STORAGE_LINK"; fi
            ln -s $BACKEND/storage/app/public "$STORAGE_LINK"
            echo "Storage symlink created: $STORAGE_LINK"

            # Fix file permissions
            find $WEBROOT -type d -exec chmod 755 {} + 2>/dev/null || true
            find $WEBROOT -type f -exec chmod 644 {} + 2>/dev/null || true

            # Storage directory must stay 775 for Laravel writes
            chmod -R 775 $BACKEND/storage $BACKEND/bootstrap/cache

            # Verify critical files exist
            echo "=== Verifying deployment ==="
            [ -f $WEBROOT/index.html ]    && echo "✓ index.html present"    || echo "✗ WARNING: index.html MISSING"
            [ -f $WEBROOT/.htaccess ]     && echo "✓ .htaccess present"     || echo "✗ WARNING: .htaccess MISSING"
            [ -f $WEBROOT/api/index.php ] && echo "✓ api/index.php present" || echo "✗ WARNING: api/index.php MISSING"
            [ -L $WEBROOT/storage ]       && echo "✓ storage symlink OK"    || echo "✗ WARNING: storage symlink MISSING"

            echo ""
            echo "=== public_html contents ==="
            ls -la $WEBROOT/
            echo ""
            echo "=== Deployment complete ==="
