name: Deploy to Hostinger
on:
  push:
    branches:
      - main
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install frontend deps
        run: cd frontend && npm install

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Install admin deps
        run: cd admin && npm install

      - name: Build admin
        run: cd admin && npm run build

      - name: Check build output
        run: |
          echo "=== Frontend ==="
          ls -la backend/public/frontend/ || echo "MISSING"
          echo "=== Admin ==="
          ls -la backend/public/admin/ || echo "MISSING"

      - name: Prepare backend for upload (strip vendor, node_modules, large storage)
        run: |
          rsync -a \
            --exclude=vendor \
            --exclude=node_modules \
            --exclude=storage/app/public \
            --exclude=storage/logs \
            --exclude=storage/framework/cache \
            --exclude=storage/framework/sessions \
            --exclude=.git \
            backend/ backend_deploy/
          echo "=== Deploy size ==="
          du -sh backend_deploy/

      - name: Upload backend via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 65002
          timeout: 300s
          command_timeout: 30m
          source: "backend_deploy/"
          target: "/home/u679970628/domains/speakeasyvalencia.com/backend/"
          strip_components: 1
          overwrite: true

      - name: Upload storage assets via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 65002
          timeout: 300s
          command_timeout: 30m
          source: "backend/storage/app/public/"
          target: "/home/u679970628/domains/speakeasyvalencia.com/backend/storage/app/public/"
          strip_components: 4
          overwrite: true

      - name: Upload frontend via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 65002
          timeout: 300s
          command_timeout: 30m
          source: "backend/public/frontend/"
          target: "/home/u679970628/domains/speakeasyvalencia.com/public_html/"
          strip_components: 3
          overwrite: true

      - name: Upload admin via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 65002
          timeout: 300s
          command_timeout: 30m
          source: "backend/public/admin/"
          target: "/home/u679970628/domains/speakeasyvalencia.com/public_html/admin/"
          strip_components: 3
          overwrite: true

      - name: Upload public_html config via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 65002
          timeout: 300s
          command_timeout: 30m
          source: "deploy/public_html/"
          target: "/home/u679970628/domains/speakeasyvalencia.com/public_html/"
          strip_components: 2
          overwrite: true

      - name: Write .env on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 65002
          envs: BACKEND_ENV
          script: |
            printf '%s' "$BACKEND_ENV" > /home/u679970628/domains/speakeasyvalencia.com/backend/.env
            echo ".env written"
        env:
          BACKEND_ENV: ${{ secrets.BACKEND_ENV }}

      - name: Post-deploy (composer + artisan + symlink)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 65002
          timeout: 300s
          command_timeout: 30m
          script: |
            BASE=/home/u679970628/domains/speakeasyvalencia.com
            mkdir -p $BASE/backend $BASE/public_html/admin
            cd $BASE/backend
            php composer.phar install --no-dev --optimize-autoloader 2>/dev/null || composer install --no-dev --optimize-autoloader
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan migrate --force
            php artisan cache:clear
            chmod -R 775 storage bootstrap/cache
            STORAGE_LINK=$BASE/public_html/storage
            if [ -L "$STORAGE_LINK" ]; then rm "$STORAGE_LINK"; fi
            ln -s $BASE/backend/storage/app/public "$STORAGE_LINK"
            echo "=== Done ==="
            ls -la $BASE/public_html/
