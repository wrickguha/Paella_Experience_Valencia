name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      BACKEND_ENV: ${{ secrets.BACKEND_ENV }}
      SSH_OPTS: -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o TCPKeepAlive=yes -o BatchMode=yes -p 65002

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Node setup with caching ────────────────────────────────
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            admin/package-lock.json

      # ── 3. Install & build frontend ───────────────────────────────
      - name: Install frontend deps
        run: cd frontend && npm ci

      - name: Build frontend
        run: cd frontend && npm run build

      # ── 4. Install & build admin ──────────────────────────────────
      - name: Install admin deps
        run: cd admin && npm ci

      - name: Build admin
        run: cd admin && npm run build

      # ── 5. Verify build outputs ───────────────────────────────────
      - name: Check build output
        run: |
          echo "=== Frontend (should contain index.html) ==="
          ls -la backend/public/frontend/ || echo "MISSING - build failed!"
          echo "=== Admin (should contain index.html) ==="
          ls -la backend/public/admin/ || echo "MISSING - build failed!"

      # ── 6. Strip large/unnecessary files from backend ────────────
      - name: Prepare backend for upload
        run: |
          rsync -a \
            --exclude=vendor \
            --exclude=node_modules \
            --exclude=storage/app/public \
            --exclude=storage/logs \
            --exclude=storage/framework/cache \
            --exclude=storage/framework/sessions \
            --exclude=storage/framework/views \
            --exclude=.git \
            --exclude=.gitignore \
            --exclude=.gitattributes \
            --exclude=error_log.txt \
            --exclude=error_log_utf8.txt \
            --exclude=tests \
            --exclude='*.md' \
            --exclude=phpunit.xml \
            --exclude=.editorconfig \
            backend/ backend_deploy/
          echo "=== Deploy size ==="
          du -sh backend_deploy/

      # ── 7. Fix line endings (CRLF → LF) for .htaccess ────────────
      - name: Fix line endings
        run: |
          if command -v dos2unix &>/dev/null; then
            dos2unix deploy/public_html/.htaccess 2>/dev/null || true
          else
            sed -i 's/\r$//' deploy/public_html/.htaccess
          fi
          echo "Line endings fixed for .htaccess"

      # ── 8. Setup SSH ──────────────────────────────────────────────
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p 65002 "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "SSH key configured"
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}

      # ── 9. Upload backend (no --delete: keeps vendor/storage safe) ─
      - name: Rsync backend to server
        run: |
          for i in 1 2 3; do
            rsync -rltz --no-perms --chmod=D755,F644 \
              -e "ssh -i ~/.ssh/id_rsa $SSH_OPTS" \
              backend_deploy/ \
              ${SSH_USERNAME}@${SSH_HOST}:/home/u679970628/domains/speakeasyvalencia.com/backend/ \
            && echo "Backend rsync succeeded on attempt $i" && break \
            || { echo "Attempt $i failed, retrying in 15s..."; sleep 15; }
          done
        env:
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_HOST: ${{ secrets.SSH_HOST }}

      # ── 10. Upload storage assets ─────────────────────────────────
      - name: Rsync storage assets to server
        run: |
          for i in 1 2 3; do
            rsync -rltz --no-perms --chmod=D755,F644 \
              -e "ssh -i ~/.ssh/id_rsa $SSH_OPTS" \
              backend/storage/app/public/ \
              ${SSH_USERNAME}@${SSH_HOST}:/home/u679970628/domains/speakeasyvalencia.com/backend/storage/app/public/ \
            && echo "Storage rsync succeeded on attempt $i" && break \
            || { echo "Attempt $i failed, retrying in 15s..."; sleep 15; }
          done
        env:
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_HOST: ${{ secrets.SSH_HOST }}

      # ── 11. Upload api entry point ────────────────────────────────
      - name: Rsync api entry point to server
        run: |
          for i in 1 2 3; do
            rsync -rltz --delete --no-perms --chmod=D755,F644 \
              -e "ssh -i ~/.ssh/id_rsa $SSH_OPTS" \
              deploy/public_html/api/ \
              ${SSH_USERNAME}@${SSH_HOST}:/home/u679970628/domains/speakeasyvalencia.com/public_html/api/ \
            && echo "API rsync succeeded on attempt $i" && break \
            || { echo "Attempt $i failed, retrying in 15s..."; sleep 15; }
          done
        env:
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_HOST: ${{ secrets.SSH_HOST }}

      # ── 12. Upload .htaccess ──────────────────────────────────────
      - name: Rsync htaccess to server
        run: |
          for i in 1 2 3; do
            rsync -ltz --no-perms --chmod=F644 \
              -e "ssh -i ~/.ssh/id_rsa $SSH_OPTS" \
              deploy/public_html/.htaccess \
              ${SSH_USERNAME}@${SSH_HOST}:/home/u679970628/domains/speakeasyvalencia.com/public_html/.htaccess \
            && echo "htaccess rsync succeeded on attempt $i" && break \
            || { echo "Attempt $i failed, retrying in 15s..."; sleep 15; }
          done
        env:
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_HOST: ${{ secrets.SSH_HOST }}

      # ── 13. Upload frontend SPA ───────────────────────────────────
      - name: Rsync frontend to server
        run: |
          for i in 1 2 3; do
            rsync -rltz --delete --no-perms --chmod=D755,F644 \
              --exclude=admin/ \
              --exclude=api/ \
              --exclude=storage/ \
              --exclude=.htaccess \
              -e "ssh -i ~/.ssh/id_rsa $SSH_OPTS" \
              backend/public/frontend/ \
              ${SSH_USERNAME}@${SSH_HOST}:/home/u679970628/domains/speakeasyvalencia.com/public_html/ \
            && echo "Frontend rsync succeeded on attempt $i" && break \
            || { echo "Attempt $i failed, retrying in 15s..."; sleep 15; }
          done
        env:
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_HOST: ${{ secrets.SSH_HOST }}

      # ── 14. Upload admin SPA ──────────────────────────────────────
      - name: Rsync admin to server
        run: |
          for i in 1 2 3; do
            rsync -rltz --delete --no-perms --chmod=D755,F644 \
              -e "ssh -i ~/.ssh/id_rsa $SSH_OPTS" \
              backend/public/admin/ \
              ${SSH_USERNAME}@${SSH_HOST}:/home/u679970628/domains/speakeasyvalencia.com/public_html/admin/ \
            && echo "Admin rsync succeeded on attempt $i" && break \
            || { echo "Attempt $i failed, retrying in 15s..."; sleep 15; }
          done
        env:
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_HOST: ${{ secrets.SSH_HOST }}

      # ── 15. Verify files landed correctly ─────────────────────────
      - name: Verify deployment files
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 65002
          connect_timeout: 60s
          script: |
            WEBROOT=/home/u679970628/domains/speakeasyvalencia.com/public_html
            echo "=== public_html permissions ==="
            ls -la $WEBROOT/
            echo ""
            echo "=== Checking critical files ==="
            [ -f $WEBROOT/index.html ]    && echo "✓ index.html present ($(stat -c '%a' $WEBROOT/index.html))" || echo "✗ index.html MISSING"
            [ -f $WEBROOT/.htaccess ]     && echo "✓ .htaccess present ($(stat -c '%a' $WEBROOT/.htaccess))"  || echo "✗ .htaccess MISSING"
            [ -f $WEBROOT/api/index.php ] && echo "✓ api/index.php present"                                   || echo "✗ api/index.php MISSING"
            echo ""
            echo "=== .htaccess content (check for CRLF) ==="
            cat -A $WEBROOT/.htaccess | head -5
            echo ""
            echo "=== public_html dir permissions ==="
            stat -c '%a %n' $WEBROOT
            stat -c '%a %n' $WEBROOT/index.html
            echo ""

            # Force-fix permissions NOW before anything else
            echo "=== Force-fixing public_html permissions ==="
            chmod 755 $WEBROOT
            find $WEBROOT -type d -exec chmod 755 {} + 2>/dev/null || true
            find $WEBROOT -type f -exec chmod 644 {} + 2>/dev/null || true
            echo "Permissions fixed"

      # ── 16. Write .env on server ──────────────────────────────────
      - name: Write .env on server
        if: ${{ env.BACKEND_ENV != '' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 65002
          connect_timeout: 60s
          envs: BACKEND_ENV
          script: |
            printf '%s' "$BACKEND_ENV" > /home/u679970628/domains/speakeasyvalencia.com/backend/.env
            echo ".env written successfully"
        env:
          BACKEND_ENV: ${{ secrets.BACKEND_ENV }}

      # ── 17. Post-deploy: composer + artisan + permissions ─────────
      - name: Post-deploy (composer + artisan + symlink + permissions)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 65002
          connect_timeout: 60s
          timeout: 60s
          command_timeout: 30m
          script: |
            BASE=/home/u679970628/domains/speakeasyvalencia.com
            BACKEND=$BASE/backend
            WEBROOT=$BASE/public_html

            # Ensure required storage directories exist
            mkdir -p $BACKEND/storage/framework/sessions
            mkdir -p $BACKEND/storage/framework/cache/data
            mkdir -p $BACKEND/storage/framework/views
            mkdir -p $BACKEND/storage/logs
            mkdir -p $WEBROOT/admin

            # Run Composer install
            cd $BACKEND
            if [ -f composer.phar ]; then
              php composer.phar install --no-dev --optimize-autoloader --no-interaction
            else
              composer install --no-dev --optimize-autoloader --no-interaction
            fi

            # Laravel artisan commands
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan migrate --force
            php artisan db:seed --class=AdminSeeder --force
            php artisan cache:clear

            # Storage permissions (must be writable by Laravel)
            chmod -R 775 $BACKEND/storage $BACKEND/bootstrap/cache

            # Storage symlink (public_html/storage -> backend/storage/app/public)
            STORAGE_LINK=$WEBROOT/storage
            if [ -L "$STORAGE_LINK" ]; then rm "$STORAGE_LINK"; fi
            if [ -e "$STORAGE_LINK" ]; then rm -rf "$STORAGE_LINK"; fi
            ln -s $BACKEND/storage/app/public "$STORAGE_LINK"
            echo "Storage symlink created: $STORAGE_LINK"

            # Final permission fix for webroot
            chmod 755 $WEBROOT
            find $WEBROOT -type d -exec chmod 755 {} +
            find $WEBROOT -type f -exec chmod 644 {} +

            # Storage directory must stay 775 for Laravel writes
            chmod -R 775 $BACKEND/storage $BACKEND/bootstrap/cache

            # Verify
            echo "=== Final verification ==="
            [ -f $WEBROOT/index.html ]    && echo "✓ index.html present"    || echo "✗ index.html MISSING"
            [ -f $WEBROOT/.htaccess ]     && echo "✓ .htaccess present"     || echo "✗ .htaccess MISSING"
            [ -f $WEBROOT/api/index.php ] && echo "✓ api/index.php present" || echo "✗ api/index.php MISSING"
            [ -L $WEBROOT/storage ]       && echo "✓ storage symlink OK"    || echo "✗ storage symlink MISSING"
            echo ""
            ls -la $WEBROOT/
            echo ""
            echo "=== Deployment complete ==="
