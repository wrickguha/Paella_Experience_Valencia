name: Deploy to Hostinger
on:
  push:
    branches:
      - main
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      BACKEND_ENV: ${{ secrets.BACKEND_ENV }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install frontend deps
        run: cd frontend && npm install

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Install admin deps
        run: cd admin && npm install

      - name: Build admin
        run: cd admin && npm run build

      - name: Check build output
        run: |
          echo "=== Frontend ==="
          ls -la backend/public/frontend/ || echo "MISSING"
          echo "=== Admin ==="
          ls -la backend/public/admin/ || echo "MISSING"

      - name: Prepare backend for upload (strip vendor, node_modules, large storage)
        run: |
          rsync -a \
            --exclude=vendor \
            --exclude=node_modules \
            --exclude=storage/app/public \
            --exclude=storage/logs \
            --exclude=storage/framework/cache \
            --exclude=storage/framework/sessions \
            --exclude=.git \
            backend/ backend_deploy/
          echo "=== Deploy size ==="
          du -sh backend_deploy/

      - name: Rsync backend to server
        uses: burnett01/rsync-deployments@v2
        with:
          switches: -avz --delete
          local_dir: backend_deploy/
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USERNAME }}
          remote_port: 65002
          remote_path: /home/u679970628/domains/speakeasyvalencia.com/backend/
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Rsync storage assets to server
        uses: burnett01/rsync-deployments@v2
        with:
          switches: -avz --delete
          local_dir: backend/storage/app/public/
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USERNAME }}
          remote_port: 65002
          remote_path: /home/u679970628/domains/speakeasyvalencia.com/backend/storage/app/public/
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Rsync frontend to server
        uses: burnett01/rsync-deployments@v2
        with:
          switches: -avz --delete
          local_dir: backend/public/frontend/
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USERNAME }}
          remote_port: 65002
          remote_path: /home/u679970628/domains/speakeasyvalencia.com/public_html/
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Rsync admin to server
        uses: burnett01/rsync-deployments@v2
        with:
          switches: -avz --delete
          local_dir: backend/public/admin/
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USERNAME }}
          remote_port: 65002
          remote_path: /home/u679970628/domains/speakeasyvalencia.com/public_html/admin/
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Rsync public_html config to server
        uses: burnett01/rsync-deployments@v2
        with:
          switches: -avz --delete
          local_dir: deploy/public_html/
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USERNAME }}
          remote_port: 65002
          remote_path: /home/u679970628/domains/speakeasyvalencia.com/public_html/
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Write .env on server
        if: ${{ env.BACKEND_ENV != '' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 65002
          envs: BACKEND_ENV
          script: |
            printf '%s' "$BACKEND_ENV" > /home/u679970628/domains/speakeasyvalencia.com/backend/.env
            echo ".env written"
        env:
          BACKEND_ENV: ${{ secrets.BACKEND_ENV }}

      - name: Post-deploy (composer + artisan + symlink)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 65002
          timeout: 300s
          command_timeout: 30m
          script: |
            BASE=/home/u679970628/domains/speakeasyvalencia.com
            mkdir -p $BASE/backend $BASE/public_html/admin
            mkdir -p $BASE/backend/storage/framework/sessions
            mkdir -p $BASE/backend/storage/framework/cache/data
            mkdir -p $BASE/backend/storage/framework/views
            mkdir -p $BASE/backend/storage/logs
            cd $BASE/backend
            php composer.phar install --no-dev --optimize-autoloader 2>/dev/null || composer install --no-dev --optimize-autoloader
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan migrate --force
            php artisan db:seed --class=AdminSeeder --force
            php artisan cache:clear
            chmod -R 775 storage bootstrap/cache
            STORAGE_LINK=$BASE/public_html/storage
            if [ -L "$STORAGE_LINK" ]; then rm "$STORAGE_LINK"; fi
            ln -s $BASE/backend/storage/app/public "$STORAGE_LINK"
            echo "=== Done ==="
            ls -la $BASE/public_html/
